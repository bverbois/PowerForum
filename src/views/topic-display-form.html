<form id="message-create-form" method="POST">
  <textarea
    id="message-body"
    name="message-body"
    rows="3"
    cols="70"
    placeholder="Write a new message..."
  ></textarea>
  <br />
  <button
    type="submit"
    form="message-create-form"
    id="message-submit"
    name="message-submit"
    class="submit"
  >
    Submit
  </button>
</form>
