<form
  id="message-create-form"
  method="POST"
  style="
    padding-left: 0%;
    padding-right: 0%;
    align-items: flex-start;
    background-color: transparent;
  "
>
  <div class="flex-row">
    <textarea
      id="message-body"
      name="message-body"
      rows="3"
      cols="70"
      placeholder="Write a new message..."
    ></textarea>
    <label class="asterisk">*</label>
  </div>
  <button
    type="submit"
    form="message-create-form"
    id="message-submit"
    name="message-submit"
    class="submit"
  >
    Submit
  </button>
</form>
