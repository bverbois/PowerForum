<!doctype html>

<html>
  <head>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script defer type="module" src="../scripts/appendNavbar.js"></script>
    <script defer type="module" src="../scripts/createTopic.js"></script>
  </head>
  <body id="body1" style="display: flex">
    <div id="navbar"></div>
    <div style="width: 80%">
      <h1>New Topic</h1>
      <form id="form1">
        <div style="display: flex; flex-direction: column">
          <div class="flex-row">
            <input
              type="text"
              id="name"
              name="name"
              value=""
              placeholder="Name..."
              style="box-sizing: border-box; width: 100%; margin-bottom: 2%"
            />
            <label class="asterisk">*</label>
          </div>
          <textarea
            id="description"
            name="description"
            rows="10"
            cols="50"
            placeholder="Enter your description here..."
          ></textarea>
        </div>
        <div style="padding-top: 3%">
          <button
            type="submit"
            id="submit-btn"
            form="form1"
            name="submit"
            class="submit"
          >
            Submit
          </button>
        </div>
        <label
          id="error"
          style="color: red; font-size: x-large; margin-top: 5%"
        ></label>
      </form>
    </div>
  </body>
</html>
